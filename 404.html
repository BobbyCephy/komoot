<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GPX file not found</title>
</head>
<body>
  <p id="message">Redirecting…</p>
  <script>
    const repo = "BobbyCephy/komoot";
    const branch = "gh-pages";
    const siteRoot = "/komoot/";
    const path = location.pathname.startsWith(siteRoot)
      ? location.pathname.slice(siteRoot.length)
      : location.pathname.replace(/^\//, "");

    if (path && path.toLowerCase().endsWith(".gpx")) {
      location.replace(`https://raw.githubusercontent.com/${repo}/${branch}/${path}`);
    } else {
      document.getElementById("message").textContent = "The requested file was not found.";
    }
  </script>
</body>
</html>
