name: Komoot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpx

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install komootgpx

      - run: |
          rm -f credentials.json
          komootgpx -s -r -m "$KOMOOT_EMAIL" -p "$KOMOOT_PASSWORD" -a -o .
          rm -f credentials.json
        env:
          KOMOOT_EMAIL: ${{ secrets.KOMOOT_EMAIL }}
          KOMOOT_PASSWORD: ${{ secrets.KOMOOT_PASSWORD }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update GPX files