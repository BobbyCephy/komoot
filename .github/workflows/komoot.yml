name: Komoot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpx

      - uses: actions/checkout@v4
        with:
          path: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install komootgpx gpxpy simplekml

      - run: |
          rm -f credentials.json
          mkdir -p gpx
          komootgpx -s -r -m "$KOMOOT_EMAIL" -p "$KOMOOT_PASSWORD" -a -o gpx
          python scripts/gpx_to_kml.py gpx/*.gpx
          rm -f credentials.json
          rm -rf scripts
        env:
          KOMOOT_EMAIL: ${{ secrets.KOMOOT_EMAIL }}
          KOMOOT_PASSWORD: ${{ secrets.KOMOOT_PASSWORD }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update GPX, KML, and KMZ files