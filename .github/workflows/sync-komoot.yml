name: Sync Komoot GPX

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install komootgpx
        run: |
          pip install komootgpx

      - name: Generate GPX files
        run: |
          mkdir -p public/gpx
          rm -f public/gpx/credentials.json
          komootgpx -s -r -m "$KOMOOT_EMAIL" -p "$KOMOOT_PASSWORD" -a -o public/gpx
          rm -f public/gpx/credentials.json
        env:
          KOMOOT_EMAIL: ${{ secrets.KOMOOT_EMAIL }}
          KOMOOT_PASSWORD: ${{ secrets.KOMOOT_PASSWORD }}

      - name: Generate index page
        run: |
          python - <<'PY'
          from pathlib import Path

          gpx_dir = Path("public/gpx")
          files = sorted(gpx_dir.glob("*.gpx"))

          links = "\n".join(
              f'<li><a href="gpx/{file.name}" download>{file.name}</a></li>'
              for file in files
          )

          html = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Komoot GPX Downloads</title>
          </head>
          <body>
            <h1>Komoot GPX Downloads</h1>
            <ul>
              {links}
            </ul>
          </body>
          </html>
          """

          Path("public/index.html").write_text(html, encoding="utf-8")
          PY

      - name: Commit updated GPX files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public
          git commit -m "Update Komoot GPX files" || echo "No changes"
          git push