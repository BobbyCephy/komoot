name: Sync Komoot GPX

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install komootgpx
        run: |
          pip install komootgpx

      - name: Generate GPX files
        run: |
          rm -rf gpx
          mkdir -p gpx
          rm -f credentials.json
          komootgpx -s -r -m "$KOMOOT_EMAIL" -p "$KOMOOT_PASSWORD" -a -o gpx
          rm -f credentials.json
          rm -f gpx/credentials.json
        env:
          KOMOOT_EMAIL: ${{ secrets.KOMOOT_EMAIL }}
          KOMOOT_PASSWORD: ${{ secrets.KOMOOT_PASSWORD }}

      - name: Generate index page
        run: |
          python - <<'PY'
          from pathlib import Path
          from html import escape

          gpx_dir = Path("gpx")
          gpx_dir.mkdir(parents=True, exist_ok=True)

          files = sorted(gpx_dir.glob("*.gpx"))

          links = "\n".join(
              f'<li><a href="gpx/{escape(file.name)}" download>{escape(file.name)}</a></li>'
              for file in files
          )

          html = f"""<!doctype html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Komoot GPX Downloads</title>
            <style>
              body {{
                font-family: sans-serif;
                max-width: 900px;
                margin: 40px auto;
                padding: 0 20px;
              }}
              li {{
                margin: 8px 0;
              }}
            </style>
          </head>
          <body>
            <h1>Komoot GPX Downloads</h1>
            <p>{len(files)} GPX file(s) available.</p>
            <ul>
              {links}
            </ul>
          </body>
          </html>
          """

          Path("index.html").write_text(html, encoding="utf-8")
          PY

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html gpx
          git commit -m "Update Komoot GPX files" || echo "No changes"
          git push