<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Komoot</title>
</head>
<body>
<ul id="files"></ul>

<script>
    fetch("https://api.github.com/repos/BobbyCephy/komoot/contents?ref=gpx")
        .then(r => r.json())
        .then(files => {
            const list = document.getElementById("files");

            files
                .filter(f => f.name.endsWith(".gpx"))
                .sort((a, b) => a.name.localeCompare(b.name))
                .forEach(f => {
                    list.innerHTML += `<li><a href="${f.name}">${f.name}</a></li>`;
                });
        });
</script>
</body>
</html>
