<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GPX files</title>
</head>
<body>
<h1>GPX files</h1>
<ul id="files"></ul>

<script>
  fetch("https://api.github.com/repos/BobbyCephy/komoot/contents?ref=gh-pages")
          .then(r => r.json())
          .then(files => {
            const list = document.getElementById("files");

            files
                    .filter(f => f.name.endsWith(".gpx"))
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .forEach(f => {
                      list.innerHTML += `<a href="${f.name}">${f.name}</a>`;
                    });
          });
</script>
</body>
</html>
