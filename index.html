<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Komoot GPX Routes</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      color: #333;
    }
    h1 { color: #2c6e49; }
    p.count { color: #666; font-size: 0.9rem; }
    ul {
      list-style: none;
      padding: 0;
    }
    li {
      border-bottom: 1px solid #eee;
      padding: 0.4rem 0;
    }
    a {
      color: #2c6e49;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    #status { color: #888; font-style: italic; }
  </style>
</head>
<body>
  <h1>Komoot GPX Routes</h1>
  <p id="status">Loading routes…</p>
  <ul id="route-list"></ul>

  <script>
    (function () {
      const API = 'https://api.github.com/repos/BobbyCephy/komoot/contents/';
      const status = document.getElementById('status');
      const list = document.getElementById('route-list');

      function displayName(filename) {
        const base = filename.replace(/\.gpx$/i, '');
        const match = base.match(/^(.+)-(\d+)$/);
        return match ? match[1] : base;
      }

      fetch(API, { headers: { Accept: 'application/vnd.github+json' } })
        .then(function (res) {
          if (!res.ok) throw new Error('GitHub API returned ' + res.status);
          return res.json();
        })
        .then(function (entries) {
          const gpxFiles = entries
            .filter(function (e) { return e.type === 'file' && /\.gpx$/i.test(e.name); })
            .sort(function (a, b) { return a.name.localeCompare(b.name); });

          if (gpxFiles.length === 0) {
            status.textContent = 'No GPX routes found.';
            return;
          }

          const base = location.href.replace(/index\.html$/, '');

          gpxFiles.forEach(function (file) {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = base + encodeURIComponent(file.name);
            a.download = file.name;
            a.textContent = displayName(file.name);
            li.appendChild(a);
            list.appendChild(li);
          });

          status.className = 'count';
          status.textContent = gpxFiles.length + ' routes available for download';
        })
        .catch(function (err) {
          status.textContent = 'Failed to load route list: ' + err.message;
        });
    }());
  </script>
</body>
</html>
